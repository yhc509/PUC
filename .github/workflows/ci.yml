name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify UPM .meta files
        run: scripts/check-unity-meta.sh

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Build solution
        run: dotnet build UnityCliBridge.sln -c Debug

      - name: Run tests
        run: dotnet test UnityCliBridge.sln
